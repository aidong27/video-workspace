<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#ffffff">
  <title>登录 - 字幕工作台</title>
  <link rel="stylesheet" href="/static/auth.css?v=20260724-3">
  <script src="/static/auth.js?v=20260726-1" defer></script>
</head>
<body>
  <header class="auth-topbar">
    <a class="brand" href="/login" aria-label="字幕工作台">
      <span class="brand-mark" aria-hidden="true">CC</span>
      <span class="brand-copy">
        <strong>字幕工作台</strong>
        <span>Video Workspace</span>
      </span>
    </a>
    <span class="beta-badge">1.0 Beta</span>
  </header>

  <main class="auth-main">
    <div class="auth-shell">
      <section class="auth-context" aria-labelledby="context-title">
        <div>
          <p class="context-kicker">Public Beta 1.0</p>
          <h1 id="context-title">欢迎回到<br>字幕工作台</h1>
          <p class="context-copy">为 B站、抖音和本地视频准备的私人处理空间。</p>
        </div>

        <div class="beta-note">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="9"></circle>
            <path d="M12 8v4M12 16h.01"></path>
          </svg>
          <p>公开测试期间，重任务可能需要排队。页面刷新后会继续恢复当前任务。</p>
        </div>

        <div class="context-status" aria-label="工作台能力">
          <span><i class="status-coral"></i>B站 / 抖音</span>
          <span><i class="status-blue"></i>本地视频</span>
          <span><i class="status-green"></i>账号隔离</span>
        </div>
      </section>

      <section class="auth-panel" aria-labelledby="auth-title">
        <div class="panel-heading">
          <p id="auth-kicker">账号访问</p>
          <h2 id="auth-title">登录</h2>
        </div>

        <nav class="auth-tabs" aria-label="账号操作">
          <a id="login-tab" href="/login">登录</a>
          <a id="register-tab" href="/register">注册</a>
        </nav>

        <form id="auth-form" novalidate>
          <label for="username">用户名</label>
          <input id="username" name="username" type="text" minlength="3" maxlength="32" autocomplete="username" autocapitalize="none" spellcheck="false" required placeholder="3-32 位字母或数字">

          <div class="register-field" id="invite-field" hidden>
            <label for="invite-code">邀请码</label>
            <input id="invite-code" name="invite_code" type="password" minlength="4" maxlength="128" autocomplete="off" spellcheck="false" placeholder="输入邀请码">
          </div>

          <label for="password">密码</label>
          <div class="password-field">
            <input id="password" name="password" type="password" minlength="8" maxlength="128" autocomplete="current-password" required placeholder="至少 8 个字符">
            <button class="password-toggle" id="toggle-password" type="button" aria-label="显示密码" title="显示密码">
              <svg class="icon eye-open" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path>
                <circle cx="12" cy="12" r="2.5"></circle>
              </svg>
              <svg class="icon eye-closed" viewBox="0 0 24 24" aria-hidden="true">
                <path d="m3 3 18 18M10.6 6.2A11.4 11.4 0 0 1 12 6c6.5 0 10 6 10 6a18 18 0 0 1-2.1 2.8M6.4 6.4C3.5 8.2 2 12 2 12s3.5 6 10 6a10.6 10.6 0 0 0 3.6-.6"></path>
              </svg>
            </button>
          </div>

          <div class="register-field" id="confirm-field" hidden>
            <label for="confirm-password">确认密码</label>
            <div class="password-field">
              <input id="confirm-password" name="confirm_password" type="password" minlength="8" maxlength="128" autocomplete="new-password" placeholder="再次输入密码">
              <button class="password-toggle" id="toggle-confirm-password" type="button" aria-label="显示确认密码" title="显示确认密码">
                <svg class="icon eye-open" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path>
                  <circle cx="12" cy="12" r="2.5"></circle>
                </svg>
                <svg class="icon eye-closed" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="m3 3 18 18M10.6 6.2A11.4 11.4 0 0 1 12 6c6.5 0 10 6 10 6a18 18 0 0 1-2.1 2.8M6.4 6.4C3.5 8.2 2 12 2 12s3.5 6 10 6a10.6 10.6 0 0 0 3.6-.6"></path>
                </svg>
              </button>
            </div>
          </div>

          <p class="caps-warning" id="caps-warning" hidden>大写锁定已开启</p>
          <p class="form-error" id="form-error" role="alert" aria-live="polite"></p>
          <button class="submit-button" id="submit-button" type="submit">
            <span class="button-spinner" aria-hidden="true"></span>
            <span id="submit-label">登录</span>
            <svg class="icon submit-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="m9 18 6-6-6-6"></path>
            </svg>
          </button>
        </form>

        <p class="auth-switch" id="auth-switch">没有账号？<a href="/register">使用邀请码注册</a></p>

        <div class="service-status" id="service-status" role="status" aria-live="polite">
          <span aria-hidden="true"></span>
          <strong>正在检查服务</strong>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
